# Infraestrutura de desenvolvimento local.
#
# As senhas aqui são fixas e óbvias de propósito: nada neste arquivo sobe para
# um ambiente real, e um projeto que exige montar um `.env` antes de rodar
# quebra o "clone e roda" que a constituição define como critério de sucesso.
#
# Sobe o sistema inteiro: infraestrutura e os quatro serviços .NET. Um
# `docker compose up --build` e um `curl` em localhost:8080 é o critério de
# sucesso da constituição.

name: microservices-rabbitmq

services:

  # Caixa de correio entre os serviços. A imagem `-management` traz o painel
  # web, que é o que torna o fluxo assíncrono visível numa demonstração.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mr-rabbitmq
    ports:
      - "5672:5672"    # protocolo AMQP — é por aqui que os serviços falam
      - "15672:15672"  # painel de administração no navegador
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [backend]

  # Pedidos e pagamentos. Bancos separados por usuário — ver infra/postgres/init.sql.
  postgres:
    image: postgres:16-alpine
    container_name: mr-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Tudo em docker-entrypoint-initdb.d roda na primeira inicialização.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # Consultar `payments_db` — o último objeto criado pelo init.sql — em vez
      # de um `pg_isready` genérico: o servidor aceita conexões antes de o
      # script terminar, e um serviço que subisse nessa janela não acharia o
      # próprio banco.
      test: ["CMD-SHELL", "psql -U postgres -d payments_db -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  # Histórico de notificações: documentos append-only, formato variável por canal.
  mongodb:
    image: mongo:7
    container_name: mr-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: notifications_db
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "mongo", "-p", "mongo",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  # Bloco de notas dos consumidores: guarda os MessageId já processados (D-4).
  # Sem persistência em disco de propósito — perder essas chaves num restart é
  # aceitável, porque as constraints únicas do Postgres e do Mongo são a
  # garantia de verdade. O Redis só evita o trabalho repetido.
  redis:
    image: redis:7-alpine
    container_name: mr-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Serviços .NET
  #
  # Todos escutam 8080 **dentro** do contêiner e se falam pelo nome do serviço na
  # rede `backend` — `postgres`, `rabbitmq`, `mongodb`, `redis` são resolvidos
  # pelo DNS interno do compose. As portas publicadas no host existem só para o
  # `curl` de demonstração e para depurar; a comunicação real não passa por elas.
  #
  # As connection strings chegam por variável de ambiente e sobrescrevem o
  # appsettings.json, que continua apontando para localhost — é isso que permite
  # rodar pela IDE contra a mesma infraestrutura, sem dois arquivos de config
  # divergindo. O `__` é como o .NET representa aninhamento de configuração.
  # ---------------------------------------------------------------------------

  orderservice:
    build:
      # Contexto na raiz, e não na pasta do serviço: o build precisa alcançar
      # Directory.Build.props e os projetos referenciados (BuildingBlocks,
      # Shared.Contracts, OrderService.Domain). Um contexto por pasta obrigaria
      # a duplicar esses projetos dentro de cada serviço.
      context: .
      dockerfile: src/OrderService/Dockerfile
    container_name: mr-orderservice
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__OrdersDb: "Host=postgres;Port=5432;Database=orders_db;Username=orders_user;Password=orders_pw"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      # `service_healthy` e não `service_started`: o OrderService aplica as
      # migrations no startup (D-14) e abre conexão com o broker antes de
      # responder. Subir junto com um Postgres que ainda está inicializando faria
      # o contêiner morrer e reiniciar em loop no primeiro `up` de uma máquina
      # limpa — justamente a experiência que esta tarefa existe para evitar.
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks: [backend]

  paymentservice:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    container_name: mr-paymentservice
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__PaymentsDb: "Host=postgres;Port=5432;Database=payments_db;Username=payments_user;Password=payments_pw"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks: [backend]

  notificationservice:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    container_name: mr-notificationservice
    ports:
      - "8083:8080"
    environment:
      Mongo__ConnectionString: "mongodb://mongo:mongo@mongodb:27017/?authSource=admin"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks: [backend]

  apigateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: mr-apigateway
    ports:
      # A única porta que um cliente precisa conhecer (plan.md §Endpoints HTTP).
      - "8080:8080"
    environment:
      ReverseProxy__Clusters__orders__Destinations__primary__Address: "http://orderservice:8080/"
      ReverseProxy__Clusters__notifications__Destinations__primary__Address: "http://notificationservice:8080/"
    depends_on:
      # Espera os destinos ficarem prontos só para o primeiro `curl` não bater
      # num 502. O gateway **não** depende deles para continuar de pé depois:
      # o /health/ready dele não checa o que está atrás (ver ApiGateway/Program.cs).
      orderservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    restart: on-failure
    networks: [backend]

volumes:
  rabbitmq-data:
  postgres-data:
  mongodb-data:

networks:
  backend:
    driver: bridge
